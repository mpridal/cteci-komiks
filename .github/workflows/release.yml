name: Vydání Čtečky

# Tag vX.Y.Z → testy, podepsané APK (arm64) + SHA-256 v GitHub Releases.
# Čtečka v tabletu si novou verzi sama stáhne (Updater) a nabídne instalaci.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VOSK_MODEL_URL: https://alphacephei.com/vosk/models/vosk-model-small-cs-0.4-rhasspy.zip
  VOSK_MODEL_SHA256: 287c3bbefc8ad67b4ab9636eecef3d62acc3719990777d03e226db5a7f19fbda

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verze z tagu
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Tag $GITHUB_REF_NAME není vMAJOR.MINOR.PATCH"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Android platforma 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Model Vosk (ověřený kontrolním součtem)
        run: |
          curl -sSL --fail -o "$RUNNER_TEMP/model.zip" "$VOSK_MODEL_URL"
          echo "$VOSK_MODEL_SHA256  $RUNNER_TEMP/model.zip" | sha256sum -c -
          python studio/tools/vosk_model.py install --source "$RUNNER_TEMP/model.zip"

      - name: Podpisový klíč ze secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.CTECI_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Chybí secret CTECI_KEYSTORE_BASE64 – nepodepsané APK se nevydává"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CTECI_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Testy Studia
        run: python -m unittest discover -s studio/tools/tests

      - name: Testy a podepsané vydání
        working-directory: app
        env:
          CTECI_KEYSTORE_PASSWORD: ${{ secrets.CTECI_KEYSTORE_PASSWORD }}
          CTECI_KEY_ALIAS: ${{ secrets.CTECI_KEY_ALIAS }}
          CTECI_KEY_PASSWORD: ${{ secrets.CTECI_KEY_PASSWORD }}
        run: ./gradlew --console=plain test :app:assembleRelease -PversionName="$VERSION"

      - name: Ověření podpisu, kontrolní součet
        run: |
          APK=$(find /tmp/cteci-komiks-build app -path '*outputs/apk/release/*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then echo "APK nenalezeno"; exit 1; fi
          "$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner" verify --print-certs "$APK"
          cp "$APK" "cteci-komiks-$VERSION.apk"
          sha256sum "cteci-komiks-$VERSION.apk" > "cteci-komiks-$VERSION.apk.sha256"
          ls -la "cteci-komiks-$VERSION.apk"
          cat "cteci-komiks-$VERSION.apk.sha256"

      - name: Poznámky z CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Čtecí komiks $VERSION" > notes.md; fi

      - name: Zveřejnit vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "cteci-komiks-$VERSION.apk" "cteci-komiks-$VERSION.apk.sha256" \
            --title "Čtecí komiks $VERSION" --notes-file notes.md
